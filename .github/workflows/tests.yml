name: Automation quality gates

on:
  push:
    paths:
      - "cartoes/**"
      - "libs/**"
      - "tools/**"
      - "requirements/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "cartoes/**"
      - "libs/**"
      - "tools/**"
      - "requirements/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cartoes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.install }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
        install: [wheel, editable]
        exclude:
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/verification.txt
      - name: Build, install and verify public fixtures offline
        run: >-
          python tools/verify.py
          --python "$(command -v python)"
          --scratch "$RUNNER_TEMP"
          --mode "${{ matrix.install }}"
