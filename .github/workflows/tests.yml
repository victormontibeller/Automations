name: Testes das automações

on:
  push:
    paths:
      - "cartoes/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "cartoes/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cartoes:
    name: Cartões / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    defaults:
      run:
        working-directory: cartoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: cartoes/pyproject.toml
      - name: Instalar a automação
        run: python -m pip install .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run regression and installed-package tests (mocked Google APIs)
        run: python -m unittest discover -s tests -v
