[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumos-cartoes"
version = "1.0.0"
description = "Resumos individuais de cartões para envio mensal pelo Hermes"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5", "automation-core==0.1.0"]

[project.scripts]
cartoes = "resumos_cartoes.cli:main"

[tool.setuptools]
packages = ["resumos_cartoes"]
package-dir = {"resumos_cartoes" = "src"}
py-modules = ["cartoes"]

