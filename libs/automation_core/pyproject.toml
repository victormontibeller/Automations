[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-core"
version = "0.1.0"
description = "Reusable Google integrations for independent automations"
requires-python = ">=3.11"
dependencies = ["google-api-python-client>=2.150.0", "google-auth>=2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
